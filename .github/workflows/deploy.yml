name: Deploy a MonsterASP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar
        run: dotnet publish SistemaVentas.csproj -c Release -o publish

      - name: Detener temporalmente la aplicación
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf '%s\n' '<html><body><h1>Sistema en actualización</h1><p>Vuelve a intentarlo en unos minutos.</p></body></html>' > "$RUNNER_TEMP/app_offline.htm"
          curl --fail --show-error --silent --ssl-reqd --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file "$RUNNER_TEMP/app_offline.htm" \
            "ftp://$FTP_SERVER/wwwroot/app_offline.htm"
          sleep 5

      - name: Subir por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: /wwwroot/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Reactivar la aplicación
        if: success()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --show-error --silent --ssl-reqd --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --quote "DELE /wwwroot/app_offline.htm" \
            "ftp://$FTP_SERVER/"